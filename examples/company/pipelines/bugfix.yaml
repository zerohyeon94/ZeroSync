# 버그 수정 흐름 (SPEC 3.5). 봇의 기본 선언과 같다. 파일 이름이 파이프라인 키다
name: 버그 수정
command: /task bug
triggers:
- discord_task
priority: bugfix
stages:
- id: diagnose
  kind: diagnose
  agent: zeta
  check: delta               # 팀원 결과를 팀장이 확인한다 (ADR-008)
- id: approve
  kind: gate
- id: implement
  kind: implement
  agent: epsilon
  check: alpha
- id: test
  kind: test
- id: review
  kind: review
  agent: delta
- id: merge
  kind: merge_gate
budget:
  max_calls: 18
  max_minutes: 150
